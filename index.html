<!DOCTYPE html>
<html>
<head>
  <title>はじめてのページ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>こんにちは、世界！</h1>
  <p>これは私が作った最初のWebページです。</p>
  <button onclick="sayHello()">押してみて</button>
  <a class="nikkei-button" href="nikkei.html">本日の日経平均株価を見る</a>
  <div class="share-area">
    <p class="share-title">SNSで共有</p>
    <div class="share-links">
      <a class="share-link line-link" href="https://social-plugins.line.me/lineit/share" target="_blank" rel="noopener noreferrer" aria-label="LINEで共有" title="LINEで共有" onclick="shareToLine(event)">
        <img src="https://cdn.simpleicons.org/line/ffffff" alt="">
      </a>
      <a class="share-link x-link" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener noreferrer" aria-label="Xで共有" title="Xで共有" onclick="shareToX(event)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.4l-5-6.5L6.1 22H3l7.2-8.3L2.8 2h6.5l4.5 5.9L18.9 2Zm-1.1 17.9h1.8L8.3 4H6.4l11.4 15.9Z"/></svg>
      </a>
      <a class="share-link instagram-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagramで共有" title="Instagramで共有" onclick="shareToInstagram(event)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.4" cy="6.7" r="1.15"/></svg>
      </a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
